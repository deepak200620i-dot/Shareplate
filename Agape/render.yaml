databases:
  - name: shareplate-db
    databaseName: shareplate
    user: shareplate_user
    plan: free
    region: oregon

services:
  # -------------------------------------------------------------
  # Backend API Web Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: shareplate-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shareplate-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: AUTO_CREATE_TABLES
        value: "1"
      - key: AUTO_SEED_ADMIN
        value: "1"
      - key: PRIVATE_UPLOAD_DIR
        value: /tmp/agape_storage
      - key: PYTHON_VERSION
        value: "3.11.9"

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: shareplate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_API_BASE
        fromService:
          type: web
          name: shareplate-backend
          envVarKey: RENDER_EXTERNAL_URL
